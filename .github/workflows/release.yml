name: Publish MiaoClip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: macos-arm64
            bundles: dmg
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            package: macos-x64
            bundles: dmg
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            package: windows-x64
            bundles: msi,nsis
            artifact-path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-24.04
            package: linux-x64
            bundles: deb,appimage
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify release tag matches app version
        shell: bash
        run: |
          app_version="$(node -e 'process.stdout.write(require("./src-tauri/tauri.conf.json").version)')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$app_version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match app version $app_version" >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            libayatana-appindicator3-dev \
            libfuse2t64 \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build install packages
        run: cargo tauri build --bundles ${{ matrix.bundles }}
        working-directory: src-tauri

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: MiaoClip-${{ matrix.package }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download all release packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: MiaoClip ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**
          body: |
            ## 安装包

            - macOS Apple Silicon：`.dmg`
            - macOS Intel：`.dmg`
            - Windows x64：`.msi` 或 `.exe`
            - Linux x64：`.deb` 或 `.AppImage`

            此版本尚未进行代码签名或公证。macOS 和 Windows 可能显示系统安全提示；Linux 的桌面集成和剪贴板来源识别也会因发行版与桌面环境而异。首次使用前请确认下载来源，并阅读项目 README 中的平台说明。
