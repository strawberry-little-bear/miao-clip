name: Build MiaoClip

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux package installation can be slow when the runner has to refresh
    # the Ubuntu mirror metadata. Leave enough time for the actual checks.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # GitHub's Ubuntu image can occasionally resolve its Azure mirror
          # slowly. Use bounded requests and a public mirror before falling
          # back to the kernel mirror so this step cannot consume the whole
          # check job without running the actual checks.
          for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$source" ]; then
              sudo sed -i \
                -e 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
                -e 's|security.ubuntu.com|archive.ubuntu.com|g' \
                "$source"
            fi
          done
          sudo install -d -m 0755 /etc/apt/apt.conf.d
          printf '%s\n' \
            'Acquire::Retries "2";' \
            'Acquire::ForceIPv4 "true";' \
            'Acquire::http::Timeout "20";' \
            'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/99-miaoclip-network >/dev/null

          if ! timeout 120s sudo apt-get update; then
            for source in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
              if [ -f "$source" ]; then
                sudo sed -i 's|archive.ubuntu.com|mirrors.edge.kernel.org|g' "$source"
              fi
            done
            timeout 120s sudo apt-get update
          fi
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check frontend syntax
        run: |
          node --check ui/main.js
          node --check ui/toast.js

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Check Rust code
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: macos-arm64
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            package: macos-x64
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            package: windows-x64
            artifact-path: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build desktop bundle
        run: cargo tauri build
        working-directory: src-tauri

      - name: Upload install packages
        uses: actions/upload-artifact@v7
        with:
          name: MiaoClip-${{ matrix.package }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 30
