<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">妙夹工作流程</title>
  <desc id="desc">从复制内容到本地整理，再到搜索和再次复制的流程图</desc>
  <rect width="1400" height="520" rx="28" fill="#f6f5f1"/>
  <text x="80" y="78" fill="#244d54" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700">妙夹把剪贴板变成一个可回收的本地工作区</text>
  <text x="80" y="116" fill="#6f7d79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">自动捕获，清晰整理，随时复用；敏感内容和隐私模式由用户掌控。</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect x="80" y="190" width="330" height="230" rx="18" fill="#fffefa" stroke="#d7e0dc" stroke-width="2"/>
    <circle cx="132" cy="244" r="28" fill="#e7f1ee"/>
    <text x="132" y="253" text-anchor="middle" fill="#34737a" font-size="25" font-weight="700">1</text>
    <text x="178" y="252" fill="#1e2e2d" font-size="24" font-weight="700">自动捕获</text>
    <text x="116" y="304" fill="#53635d" font-size="17">文本、URL、账号</text>
    <text x="116" y="333" fill="#53635d" font-size="17">图片、文件、敏感内容</text>
    <text x="116" y="380" fill="#6f7d79" font-size="15">来源应用 · 完整日期时间</text>
    <rect x="535" y="190" width="330" height="230" rx="18" fill="#fffefa" stroke="#d7e0dc" stroke-width="2"/>
    <circle cx="587" cy="244" r="28" fill="#f6e6a8"/>
    <text x="587" y="253" text-anchor="middle" fill="#886b1e" font-size="25" font-weight="700">2</text>
    <text x="633" y="252" fill="#1e2e2d" font-size="24" font-weight="700">本地整理</text>
    <text x="571" y="304" fill="#53635d" font-size="17">搜索、筛选、收藏</text>
    <text x="571" y="333" fill="#53635d" font-size="17">批量删除、暂停、隐私模式</text>
    <text x="571" y="380" fill="#6f7d79" font-size="15">敏感原文默认遮罩</text>
    <rect x="990" y="190" width="330" height="230" rx="18" fill="#fffefa" stroke="#d7e0dc" stroke-width="2"/>
    <circle cx="1042" cy="244" r="28" fill="#d9edf0"/>
    <text x="1042" y="253" text-anchor="middle" fill="#34737a" font-size="25" font-weight="700">3</text>
    <text x="1088" y="252" fill="#1e2e2d" font-size="24" font-weight="700">快速复用</text>
    <text x="1026" y="304" fill="#53635d" font-size="17">再次复制文本、图片、文件</text>
    <text x="1026" y="333" fill="#53635d" font-size="17">处理 JSON、清洁文本</text>
    <text x="1026" y="380" fill="#6f7d79" font-size="15">点击桌面提示可回到对应记录</text>
    <path d="M430 305h70" stroke="#78a9a7" stroke-width="4" stroke-linecap="round"/>
    <path d="m485 287 22 18-22 18" fill="none" stroke="#78a9a7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M885 305h70" stroke="#78a9a7" stroke-width="4" stroke-linecap="round"/>
    <path d="m940 287 22 18-22 18" fill="none" stroke="#78a9a7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
