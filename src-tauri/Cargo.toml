[package]
name = "miao-clip"
version = "0.1.0"
description = "A local-first clipboard toolbox"
authors = ["strawberry-little-bear"]
license = "MIT"
repository = "https://github.com/strawberry-little-bear/miao-clip"
readme = "../README.md"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "miao_clip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
arboard = "3"
clipboard-master = "4.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-log = "2"
